# Docker Compose configuration for local development.
# For production, remove the bind mount and the --reload flag.

services:
  cag-estimator:
    build: .
    container_name: cag-estimator
    ports:
      - "8000:8000"

    env_file:
      - .env

    # Override REDIS_URL for the in-network Redis service. The .env value
    # (redis://localhost:6379) is meant for running uvicorn outside Docker.
    environment:
      REDIS_URL: redis://redis:6379

    depends_on:
      redis:
        condition: service_healthy

    volumes:
      - ./app:/app/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    # Redis Stack bundles the RediSearch module that redisvl uses for the
    # semantic cache's vector similarity queries. The vanilla ``redis:7-alpine``
    # image does NOT ship it: the app still runs, but the semantic cache
    # disables itself at startup and only the exact-match layer works.
    image: redis/redis-stack:7.4.0-v0
    container_name: cag-estimator-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
